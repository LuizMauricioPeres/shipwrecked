[package]
name         = "swed"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description  = "Shipwrecked (SWed) — Harbour/xBase .prg to Rust transpiler"
keywords     = ["harbour", "xbase", "clipper", "transpiler", "compiler"]
categories   = ["development-tools", "compilers"]

[[bin]]
name = "swed"
path = "src/main.rs"

[dependencies]
logos       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
encoding_rs = { workspace = true }
swed_co     = { workspace = true }
swed_nm     = { workspace = true }
swed_rt     = { workspace = true }
swed_mkh    = { workspace = true }

[features]
default     = []
oop         = []
dbf         = []
source-maps = []

[lints]
workspace = true
