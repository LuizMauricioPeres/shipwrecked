[workspace]
members  = ["swed", "swed_rt", "swed_mkh", "swed_co", "swed_bf", "swed_db", "swed_io", "swed_kn", "swed_ui", "swed_nm"]
resolver = "2"

[workspace.package]
version      = "0.2.0"
edition      = "2021"
rust-version = "1.75"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/shipwrecked/swed"
authors      = ["Shipwrecked Project — in honor of Barry Rebell & Brian Russell"]

[workspace.dependencies]
# — external —
logos       = "0.14.4"
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.149"
thiserror   = "1.0.69"
encoding_rs = "0.8"
byteorder   = "1.5"
md5         = "0.7"
walkdir     = "2"
ratatui     = "0.30"
crossterm   = "0.29"
# — internal —
swed_co  = { path = "swed_co" }
swed_rt  = { path = "swed_rt" }
swed_bf  = { path = "swed_bf" }
swed_nm  = { path = "swed_nm" }
swed_mkh = { path = "swed_mkh" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"

[profile.dev]
opt-level = 1

[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all                     = "warn"
pedantic                = "warn"
module_name_repetitions = "allow"
must_use_candidate      = "allow"