[workspace]
members  = ["swed", "swed_rt", "swed_mkh"]
resolver = "2"

[workspace.package]
version      = "0.2.0"
edition      = "2021"
rust-version = "1.75"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/shipwrecked/swed"
authors      = ["Shipwrecked Project — in honor of Barry Rebell & Brian Russell"]

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "debuginfo"

[profile.dev]
opt-level = 1

[workspace.lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all                     = "warn"
pedantic                = "warn"
module_name_repetitions = "allow"
must_use_candidate      = "allow"