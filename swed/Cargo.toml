[package]
name         = "swed"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
description  = "Shipwrecked (SWed) — Harbour/xBase .prg to Rust transpiler"
keywords     = ["harbour", "xbase", "clipper", "transpiler", "compiler"]
categories   = ["development-tools", "compilers"]

[[bin]]
name = "swed"
path = "src/main.rs"

[dependencies]
logos      = "0.14.4"
serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror  = "1.0.69"
swed_rt    = { path = "../swed_rt" }

[features]
default     = []
oop         = []
dbf         = []
source-maps = []

[lints.rust]
unsafe_code  = "forbid"
missing_docs = "warn"

[lints.clippy]
all                     = "warn"
pedantic                = "warn"
module_name_repetitions = "allow"
must_use_candidate      = "allow"
