version      = "0.1.0"
edition      = "2021"
authors      = ["Sr. Barruga"]
description  = "SWed demo — Sandbox de código transpilado"

[[bin]]
name = "demo"
path = "resta1.rs"

[[bin]]
name = "resta1_swed"
